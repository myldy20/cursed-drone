<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#08070c">
  <meta name="description" content="Cursed Drone — procedural dark ambient instrument by Myldy Design">
  <title>Cursed Drone</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background: #08070c; color: #eee2c5; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: #08070c; }
    body { display: grid; place-items: center; }
    #canvas { display: block; width: 100%; height: 100%; border: 0; outline: 0; image-rendering: auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    #gate { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 35%, rgba(117, 67, 171, .23), transparent 42%), #08070c; transition: opacity 180ms ease; }
    #gate.hidden { pointer-events: none; opacity: 0; }
    .gate-card { width: min(560px, 100%); padding: 28px; border: 1px solid #544860; background: rgba(24, 20, 32, .96); box-shadow: 0 24px 80px rgba(0, 0, 0, .45); text-align: center; }
    .mark { margin: 0 0 10px; font-size: clamp(26px, 7vw, 52px); letter-spacing: .09em; line-height: 1; }
    .tagline { margin: 0 0 12px; color: #978f9e; line-height: 1.45; }
    .orientation-hint { display: none; margin: 0 0 24px; color: #75dab3; line-height: 1.4; }
    #start { width: 100%; min-height: 58px; border: 1px solid #75dab3; background: #432b5b; color: #eee2c5; font: inherit; font-weight: 700; letter-spacing: .06em; cursor: pointer; }
    #start:disabled { border-color: #544860; color: #978f9e; cursor: wait; }
    #status { min-height: 1.4em; margin: 14px 0 0; color: #978f9e; font-size: 12px; }
    #fullscreen { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 8; width: 50px; height: 50px; padding: 0; border: 1px solid #75dab3; border-radius: 8px; background: rgba(24, 20, 32, .92); color: #eee2c5; font: 700 25px/1 ui-monospace, monospace; cursor: pointer; touch-action: manipulation; box-shadow: 0 8px 28px rgba(0, 0, 0, .4); }
    #fullscreen[hidden] { display: none; }
    #fatal { position: fixed; inset: auto 12px 12px; z-index: 20; display: none; padding: 12px 14px; border: 1px solid #e14d60; background: #181420; color: #eee2c5; white-space: pre-wrap; }
    @media (orientation: portrait) and (max-width: 720px) {
      .gate-card { padding: 22px; }
      .orientation-hint { display: block; }
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <button id="fullscreen" type="button" hidden aria-label="Enter fullscreen" title="Enter fullscreen">⛶</button>
  <div id="gate"><div class="gate-card">
    <h1 class="mark">CURSED DRONE</h1>
    <p id="tagline" class="tagline">A procedural dark ambient instrument with four sound actors, evolving spaces, modulation and effects — no samples.</p>
    <p id="orientation-hint" class="orientation-hint">Rotate your phone to landscape for the full interface.</p>
    <button id="start" type="button" disabled>LOADING...</button>
    <p id="status">Preparing WebAssembly and instrument memory</p>
  </div></div>
  <pre id="fatal"></pre>

  <script>
    const canvas = document.getElementById('canvas');
    const gate = document.getElementById('gate');
    const taglineNode = document.getElementById('tagline');
    const orientationHintNode = document.getElementById('orientation-hint');
    const startButton = document.getElementById('start');
    const fullscreenButton = document.getElementById('fullscreen');
    const statusNode = document.getElementById('status');
    const fatalNode = document.getElementById('fatal');
    const storageRoot = '/home/web_user/.local/share/myldy20/cursed-drone';
    const coarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    const translations = {
      en: {
        tagline: 'A procedural dark ambient instrument with four sound actors, evolving spaces, modulation and effects — no samples.',
        orientation: 'Rotate your phone to landscape for the full interface.',
        loading: 'LOADING...',
        preparing: 'Preparing WebAssembly and instrument memory',
        start: 'START CURSED DRONE',
        sound: 'Audio starts after you press the button',
        starting: 'Starting the audio engine...',
        saved: 'Loading saved settings...',
        fullscreen: 'Enter fullscreen',
        unknownError: 'Unknown startup error',
        startupError: 'STARTUP ERROR'
      },
      ru: {
        tagline: 'Процедурный dark ambient-инструмент: четыре звуковых актёра, меняющиеся пространства, модуляция и эффекты — без семплов.',
        orientation: 'Поверни телефон горизонтально — так будет доступен весь интерфейс.',
        loading: 'ЗАГРУЗКА...',
        preparing: 'Подготавливаю WebAssembly и память инструмента',
        start: 'ЗАПУСТИТЬ ГУДЕЖ',
        sound: 'Звук включится после нажатия',
        starting: 'Запускаю аудиодвижок...',
        saved: 'Загружаю сохранённые настройки...',
        fullscreen: 'Вернуться в полноэкранный режим',
        unknownError: 'Неизвестная ошибка запуска',
        startupError: 'ОШИБКА ЗАПУСКА'
      }
    };
    const browserLanguages = navigator.languages && navigator.languages.length
      ? navigator.languages : [navigator.language || 'en'];
    const language = browserLanguages.some((value) => /^ru(?:-|$)/i.test(value || '')) ? 'ru' : 'en';
    const copy = translations[language] || translations.en;
    document.documentElement.lang = language;
    taglineNode.textContent = copy.tagline;
    orientationHintNode.textContent = copy.orientation;
    startButton.textContent = copy.loading;
    statusNode.textContent = copy.preparing;
    fullscreenButton.setAttribute('aria-label', copy.fullscreen);
    fullscreenButton.title = copy.fullscreen;

    let runtimeReady = false;
    let storageReady = false;
    let started = false;
    let syncTimer = 0;
    let resizeGeneration = 0;

    function setStatus(message) { statusNode.textContent = message || ''; }
    function showFatal(message) {
      fatalNode.style.display = 'block';
      fatalNode.textContent = String(message || copy.unknownError);
      gate.classList.remove('hidden');
      fullscreenButton.hidden = true;
      startButton.disabled = true;
      startButton.textContent = copy.startupError;
    }
    function fullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement || null;
    }
    function updateFullscreenButton() {
      fullscreenButton.hidden = !started || Boolean(fullscreenElement());
    }
    function resizeCanvas() {
      const viewport = window.visualViewport;
      const cssWidth = Math.max(320, Math.floor(viewport ? viewport.width : window.innerWidth || 320));
      const cssHeight = Math.max(240, Math.floor(viewport ? viewport.height : window.innerHeight || 240));
      const pixelRatio = Math.min(window.devicePixelRatio || 1, coarsePointer ? 1 : 2);
      const pixelWidth = Math.floor(cssWidth * pixelRatio);
      const pixelHeight = Math.floor(cssHeight * pixelRatio);
      canvas.style.width = cssWidth + 'px';
      canvas.style.height = cssHeight + 'px';
      if (started && typeof Module !== 'undefined' && typeof Module._cursed_drone_web_resize === 'function') {
        Module._cursed_drone_web_resize(pixelWidth, pixelHeight);
      } else if (typeof Module !== 'undefined' && typeof Module.setCanvasSize === 'function') {
        Module.setCanvasSize(pixelWidth, pixelHeight, false);
      } else {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
      }
    }
    function scheduleResize() {
      const generation = ++resizeGeneration;
      const apply = () => {
        if (generation !== resizeGeneration) return;
        resizeCanvas();
      };
      window.requestAnimationFrame(() => window.requestAnimationFrame(apply));
      [80, 220, 500, 900].forEach((delay) => window.setTimeout(apply, delay));
    }
    function requestLandscapeFullscreen() {
      const element = document.documentElement;
      let result;
      try {
        if (element.requestFullscreen) result = element.requestFullscreen({ navigationUI: 'hide' });
        else if (element.webkitRequestFullscreen) result = element.webkitRequestFullscreen();
      } catch (error) {
        console.warn('Fullscreen request failed:', error);
      }
      const afterFullscreen = () => {
        if (screen.orientation && typeof screen.orientation.lock === 'function') {
          Promise.resolve(screen.orientation.lock('landscape')).catch(() => {});
        }
        updateFullscreenButton();
        scheduleResize();
      };
      if (result && typeof result.then === 'function') {
        result.then(afterFullscreen).catch(() => {
          updateFullscreenButton();
          scheduleResize();
        });
      } else {
        window.setTimeout(afterFullscreen, 0);
      }
    }
    function enableStart() {
      if (!runtimeReady || !storageReady || started) return;
      startButton.disabled = false;
      startButton.textContent = copy.start;
      setStatus(copy.sound);
    }
    function syncStorage(populate, done) {
      try {
        FS.syncfs(populate, (error) => {
          if (error) console.warn('Cursed Drone storage sync:', error);
          if (done) done(error);
        });
      } catch (error) {
        console.warn('Cursed Drone storage unavailable:', error);
        if (done) done(error);
      }
    }
    function mountStorage() {
      try {
        FS.mkdirTree(storageRoot);
        FS.mount(IDBFS, {}, storageRoot);
        syncStorage(true, () => { storageReady = true; enableStart(); });
      } catch (error) {
        console.warn('IndexedDB mount failed; using temporary memory:', error);
        storageReady = true;
        enableStart();
      }
    }
    function beginPersistentSync() {
      syncTimer = window.setInterval(() => syncStorage(false), 60000);
      window.addEventListener('pagehide', () => syncStorage(false), { capture: true });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') syncStorage(false);
      });
    }
    fullscreenButton.addEventListener('click', requestLandscapeFullscreen);
    startButton.addEventListener('click', () => {
      if (!runtimeReady || !storageReady || started) return;
      requestLandscapeFullscreen();
      started = true;
      startButton.disabled = true;
      setStatus(copy.starting);
      resizeCanvas();
      beginPersistentSync();
      gate.classList.add('hidden');
      updateFullscreenButton();
      try {
        const arguments = coarsePointer
          ? ['--android-audio-burst=2048', '--web-frame-ms=33']
          : ['--android-audio-burst=1024', '--web-frame-ms=16'];
        Module.callMain(arguments);
        scheduleResize();
      } catch (error) {
        window.clearInterval(syncTimer);
        showFatal(error && error.stack ? error.stack : error);
      }
    });
    window.addEventListener('resize', scheduleResize, { passive: true });
    window.addEventListener('orientationchange', scheduleResize, { passive: true });
    window.addEventListener('pageshow', scheduleResize, { passive: true });
    document.addEventListener('fullscreenchange', () => {
      updateFullscreenButton();
      scheduleResize();
    }, { passive: true });
    document.addEventListener('webkitfullscreenchange', () => {
      updateFullscreenButton();
      scheduleResize();
    }, { passive: true });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize, { passive: true });
    if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', scheduleResize);
    resizeCanvas();

    var Module = {
      canvas,
      noInitialRun: true,
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
      setStatus,
      onRuntimeInitialized() {
        runtimeReady = true;
        setStatus(copy.saved);
        mountStorage();
      },
      onAbort(reason) { showFatal(reason); }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
