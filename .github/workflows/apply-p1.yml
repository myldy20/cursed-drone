name: Apply P1 hardening

on:
  push:
    branches:
      - agent/v0.14.1-p1-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Decode and apply patch
        run: |
          base64 -d tools/apply_p1_patch.py.gz.b64 | gzip -d > /tmp/apply_p1_patch.py
          python3 /tmp/apply_p1_patch.py

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Build and test native targets
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Commit patch
        run: |
          rm -f tools/apply_p1_patch.py.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden 0.14.1 persistence and realtime paths"
          git push origin HEAD:agent/v0.14.1-p1-hardening
