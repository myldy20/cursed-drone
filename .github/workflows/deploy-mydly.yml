name: deploy / myldy.ru preview

on:
  push:
    branches: [preview]
  workflow_dispatch:
    inputs:
      action:
        description: Deploy selected ref or roll back to an existing release
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]
      release:
        description: Existing release directory name for rollback
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cursed-drone-mydly-preview
  cancel-in-progress: false

jobs:
  build-preview:
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: [self-hosted, myldy-home]
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ci-preview-playwright
      EMSDK_CACHE_DIR: ${{ github.workspace }}/.ci-preview-emsdk
    steps:
      - name: Runner metadata
        run: |
          echo "runner.name=${{ runner.name }}"
          echo "runner.environment=${{ runner.environment }}"
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"
      - name: Check home runner disk before heavy build
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          USED="$(df -P "$GITHUB_WORKSPACE" | awk 'NR==2 {gsub(/%/, "", $5); print $5}')"
          if (( USED >= 90 )); then
            echo "::error::Home runner filesystem is ${USED}% full; investigate disk before CI."
            exit 1
          fi
          if (( USED >= 85 )); then
            echo "::error::Home runner filesystem is ${USED}% full; refusing native/WASM/Chromium build."
            exit 1
          fi
          if (( USED >= 80 )); then
            echo "::warning::Home runner filesystem is ${USED}% full; build may proceed but cleanup is mandatory."
          fi
      - name: Checkout trusted commit
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Run portable native tests
        run: |
          set -euo pipefail
          cmake -S . -B build-preview-native -DCMAKE_BUILD_TYPE=Release -DCURSED_DRONE_BUILD_SDL=OFF -DCURSED_DRONE_BUILD_TESTS=ON -DCURSED_DRONE_BUILD_TOOLS=OFF
          cmake --build build-preview-native --parallel 2
          ctest --test-dir build-preview-native --output-on-failure
      - name: Set up Emscripten in temporary home-runner workspace
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: ${{ env.EMSDK_CACHE_DIR }}
      - name: Build WebAssembly preview
        run: |
          set -euo pipefail
          emcmake cmake -S . -B build-preview-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DCURSED_DRONE_BUILD_SDL=OFF -DCURSED_DRONE_BUILD_TESTS=OFF -DCURSED_DRONE_BUILD_TOOLS=OFF -DCURSED_DRONE_ENABLE_PLAITS=ON
          cmake --build build-preview-web --target cursed-drone-web --parallel 2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned browser runtime in temporary home-runner workspace
        run: |
          npm install --no-save --no-package-lock playwright@1.54.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Start build-machine static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory build-preview-web >preview-web-server.log 2>&1 &
          echo $! > preview-web-server.pid
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat preview-web-server.log
          exit 1
      - name: Run browser interaction smoke tests
        env:
          CURSED_DRONE_WEB_URL: http://127.0.0.1:4173
          CURSED_DRONE_SMOKE_OUTPUT: dist/preview-web-smoke
        run: node web/tests/smoke.mjs
      - name: Assemble compact deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="$GITHUB_WORKSPACE/dist/myldy-preview"
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR"
          cp build-preview-web/index.html "$SITE_DIR/"
          cp build-preview-web/index.js "$SITE_DIR/"
          cp build-preview-web/index.wasm "$SITE_DIR/"
          test ! -f build-preview-web/index.data || cp build-preview-web/index.data "$SITE_DIR/"
          touch "$SITE_DIR/.nojekyll"
          printf '%s\n' "$(cat VERSION)" > "$SITE_DIR/version.txt"
          test -s "$SITE_DIR/index.html"
          test -s "$SITE_DIR/index.js"
          test -s "$SITE_DIR/index.wasm"

          VERSION_VALUE="$(cat VERSION)"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CONTENT_HASH="$({ cd "$SITE_DIR"; find . -type f ! -name build.json -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | awk '{print $1}')"
          export VERSION_VALUE BUILT_AT CONTENT_HASH SITE_DIR
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "project": "cursed-drone",
              "version": os.environ["VERSION_VALUE"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "built_at_utc": os.environ["BUILT_AT"],
              "deployed_at_utc": None,
              "content_hash": os.environ["CONTENT_HASH"],
          }
          Path(os.environ["SITE_DIR"], "build.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          BUNDLE="cursed-drone-web-${GITHUB_SHA}.tar.gz"
          tar -C "$SITE_DIR" -czf "dist/$BUNDLE" .
          (cd dist && sha256sum "$BUNDLE" > "$BUNDLE.sha256")
          du -h "dist/$BUNDLE"
      - name: Upload compact deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: cursed-drone-web-${{ github.sha }}
          path: |
            dist/cursed-drone-web-${{ github.sha }}.tar.gz
            dist/cursed-drone-web-${{ github.sha }}.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
      - name: Cleanup home build processes and workspace
        if: always()
        shell: bash
        run: |
          if test -f preview-web-server.pid; then
            kill "$(cat preview-web-server.pid)" 2>/dev/null || true
          fi
          rm -rf \
            "$GITHUB_WORKSPACE/preview-web-server.pid" \
            "$GITHUB_WORKSPACE/preview-web-server.log" \
            "$GITHUB_WORKSPACE/build-preview-native" \
            "$GITHUB_WORKSPACE/build-preview-web" \
            "$GITHUB_WORKSPACE/dist" \
            "$GITHUB_WORKSPACE/node_modules" \
            "$PLAYWRIGHT_BROWSERS_PATH" \
            "$EMSDK_CACHE_DIR"

  deploy:
    if: github.event_name == 'push' || inputs.action == 'deploy'
    needs: build-preview
    runs-on: [self-hosted, myldy-vps, cursed-drone]
    timeout-minutes: 15
    steps:
      - name: Runner metadata
        run: |
          echo "runner.name=${{ runner.name }}"
          echo "runner.environment=${{ runner.environment }}"
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"
      - name: Check Selectel VPS disk before deployment
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          USED="$(df -P / | awk 'NR==2 {gsub(/%/, "", $5); print $5}')"
          if (( USED >= 90 )); then
            echo "::error::Selectel VPS root is ${USED}% full; investigate disk before deployment."
            exit 1
          fi
          if (( USED >= 85 )); then
            echo "::warning::Selectel VPS root is ${USED}% full; deployment remains activation-only and no build will run here."
          elif (( USED >= 80 )); then
            echo "::warning::Selectel VPS root is ${USED}% full; watch release retention closely."
          fi
      - name: Download compact home-runner bundle
        uses: actions/download-artifact@v4
        with:
          name: cursed-drone-web-${{ github.sha }}
          path: deploy-input
      - name: Verify bundle checksum and metadata
        shell: bash
        run: |
          set -euo pipefail
          cd deploy-input
          sha256sum -c "cursed-drone-web-${GITHUB_SHA}.tar.gz.sha256"
          mkdir extracted
          tar -xzf "cursed-drone-web-${GITHUB_SHA}.tar.gz" -C extracted
          test -s extracted/index.html
          test -s extracted/index.js
          test -s extracted/index.wasm
          export EXTRACTED="$GITHUB_WORKSPACE/deploy-input/extracted"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["EXTRACTED"], "build.json").read_text(encoding="utf-8"))
          assert data["project"] == "cursed-drone"
          assert data["commit_sha"] == os.environ["GITHUB_SHA"]
          assert len(data["commit_sha"]) == 40
          assert data["built_at_utc"].endswith("Z")
          assert data["deployed_at_utc"] is None
          assert len(data["content_hash"]) == 64
          PY
      - name: Stage, validate and switch current atomically
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/srv/www/cursed-drone
          RELEASES_ROOT="$ROOT/releases"
          CURRENT="$ROOT/current"
          SITE_DIR="$GITHUB_WORKSPACE/deploy-input/extracted"
          VERSION_VALUE="$(cat "$SITE_DIR/version.txt")"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          RELEASE_ID="${VERSION_VALUE}-${GITHUB_SHA:0:12}-${STAMP}"
          RELEASE_DIR="$RELEASES_ROOT/$RELEASE_ID"
          STAGING="$ROOT/.staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TMP_LINK="$ROOT/.current-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          mkdir -p "$RELEASES_ROOT"
          if test -e "$CURRENT" && ! test -L "$CURRENT"; then
            echo "Refusing to replace non-symlink $CURRENT" >&2
            exit 1
          fi
          test ! -e "$RELEASE_DIR"
          rm -rf "$STAGING" "$TMP_LINK"
          mkdir "$STAGING"
          trap 'rm -rf "$STAGING" "$TMP_LINK"; test -z "${validation_pid:-}" || kill "$validation_pid" 2>/dev/null || true' EXIT
          cp -a "$SITE_DIR"/. "$STAGING"/

          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export STAGING DEPLOYED_AT VERSION_VALUE
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["STAGING"], "build.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["project"] == "cursed-drone"
          assert data["version"] == os.environ["VERSION_VALUE"]
          assert data["commit_sha"] == os.environ["GITHUB_SHA"]
          data["deployed_at_utc"] = os.environ["DEPLOYED_AT"]
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          EXPECTED_HASH="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["content_hash"])' "$STAGING/build.json")"
          ACTUAL_HASH="$({ cd "$STAGING"; find . -type f ! -name build.json -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | awk '{print $1}')"
          test "$ACTUAL_HASH" = "$EXPECTED_HASH"
          test -s "$STAGING/index.html"
          test -s "$STAGING/index.js"
          test -s "$STAGING/index.wasm"
          test "$(cat "$STAGING/version.txt")" = "$VERSION_VALUE"

          python3 -m http.server 4174 --bind 127.0.0.1 --directory "$STAGING" >staging-server.log 2>&1 &
          validation_pid=$!
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4174/index.html >/dev/null; then break; fi
            if test "$attempt" -eq 20; then cat staging-server.log; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/build.json >/dev/null
          kill "$validation_pid" 2>/dev/null || true
          validation_pid=""

          mv "$STAGING" "$RELEASE_DIR"
          ln -s "$RELEASE_DIR" "$TMP_LINK"
          mv -Tf "$TMP_LINK" "$CURRENT"
          test "$(readlink -f "$CURRENT")" = "$RELEASE_DIR"

          CURRENT_REAL="$(readlink -f "$CURRENT")"
          PREVIOUS_KEPT=0
          while IFS= read -r old_release; do
            test -n "$old_release" || continue
            OLD_REAL="$(readlink -f "$old_release")"
            if test "$OLD_REAL" = "$CURRENT_REAL"; then
              continue
            fi
            if (( PREVIOUS_KEPT < 2 )); then
              PREVIOUS_KEPT=$((PREVIOUS_KEPT + 1))
              continue
            fi
            rm -rf -- "$old_release"
          done < <(find "$RELEASES_ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)

          trap - EXIT
          echo "release=$RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "current=$(readlink -f "$CURRENT")" >> "$GITHUB_STEP_SUMMARY"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "retention=current + 2 previous releases" >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup VPS deployment workspace
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$GITHUB_WORKSPACE/deploy-input" \
            "/srv/www/cursed-drone/.staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "/srv/www/cursed-drone/.current-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$GITHUB_WORKSPACE/staging-server.log"

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: [self-hosted, myldy-vps, cursed-drone]
    timeout-minutes: 10
    steps:
      - name: Runner metadata
        run: |
          echo "runner.name=${{ runner.name }}"
          echo "runner.environment=${{ runner.environment }}"
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"
      - name: Check Selectel VPS disk before rollback
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          USED="$(df -P / | awk 'NR==2 {gsub(/%/, "", $5); print $5}')"
          if (( USED >= 90 )); then
            echo "::error::Selectel VPS root is ${USED}% full; investigate disk before rollback operations."
            exit 1
          fi
          if (( USED >= 80 )); then
            echo "::warning::Selectel VPS root is ${USED}% full."
          fi
      - name: Switch current to an existing immutable release
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          ROOT=/srv/www/cursed-drone
          RELEASES_ROOT="$ROOT/releases"
          CURRENT="$ROOT/current"
          case "$RELEASE" in ""|*/*|*..*) echo "Provide an exact release directory name" >&2; exit 1;; esac
          TARGET="$RELEASES_ROOT/$RELEASE"
          test -d "$TARGET"
          TARGET_REAL="$(readlink -f "$TARGET")"
          case "$TARGET_REAL" in "$RELEASES_ROOT"/*) ;; *) echo "Release resolves outside project directory" >&2; exit 1;; esac
          export TARGET_REAL
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["TARGET_REAL"], "build.json").read_text(encoding="utf-8"))
          assert data["project"] == "cursed-drone" and len(data["commit_sha"]) == 40
          PY
          if test -e "$CURRENT" && ! test -L "$CURRENT"; then echo "Refusing to replace non-symlink $CURRENT" >&2; exit 1; fi
          TMP_LINK="$ROOT/.current-rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'rm -f "$TMP_LINK"' EXIT
          rm -f "$TMP_LINK"
          ln -s "$TARGET_REAL" "$TMP_LINK"
          mv -Tf "$TMP_LINK" "$CURRENT"
          test "$(readlink -f "$CURRENT")" = "$TARGET_REAL"
          trap - EXIT
          echo "rollback=$RELEASE" >> "$GITHUB_STEP_SUMMARY"
          echo "current=$TARGET_REAL" >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup rollback temp links
        if: always()
        shell: bash
        run: rm -f "/srv/www/cursed-drone/.current-rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
