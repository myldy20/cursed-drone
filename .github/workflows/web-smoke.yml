name: web-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: web-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, myldy-vps, cursed-drone]
    timeout-minutes: 35
    steps:
      - name: Runner metadata
        run: |
          echo "runner.name=${{ runner.name }}"
          echo "runner.environment=${{ runner.environment }}"
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - name: Build WebAssembly app in pinned Emscripten container
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/src" -w /src \
            emscripten/emsdk:4.0.10 \
            bash -ec '
              emcmake cmake -S . -B build-web -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCURSED_DRONE_BUILD_SDL=OFF \
                -DCURSED_DRONE_BUILD_TESTS=OFF \
                -DCURSED_DRONE_BUILD_TOOLS=OFF \
                -DCURSED_DRONE_ENABLE_PLAITS=ON
              cmake --build build-web --target cursed-drone-web --parallel 2
            '
      - name: Start static server
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory build-web >web-server.log 2>&1 &
          echo $! > web-server.pid
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat web-server.log
          exit 1
      - name: Test mouse, touch, Retina and letterbox routing in pinned browser container
        run: |
          mkdir -p dist/web-smoke
          docker run --rm --network host --ipc=host \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            -e PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            -e CURSED_DRONE_WEB_URL=http://127.0.0.1:4173 \
            -e CURSED_DRONE_SMOKE_OUTPUT=/src/dist/web-smoke \
            -v "$PWD:/src" \
            mcr.microsoft.com/playwright:v1.54.1-noble \
            bash -ec '
              trap "chown -R $HOST_UID:$HOST_GID /src/dist/web-smoke 2>/dev/null || true" EXIT
              mkdir -p /tmp/cursed-drone-smoke
              cp /src/web/tests/smoke.mjs /tmp/cursed-drone-smoke/
              cd /tmp/cursed-drone-smoke
              npm init -y >/dev/null 2>&1
              npm install --no-package-lock --no-save playwright@1.54.1 pngjs@7.0.0 >/dev/null
              node smoke.mjs
            '
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cursed-drone-web-smoke
          path: |
            dist/web-smoke
            web-server.log
          if-no-files-found: warn
