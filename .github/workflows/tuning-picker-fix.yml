name: tuning-picker-fix

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  tuning-picker:
    if: github.head_ref == 'agent/android-audio-ui-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-audio-ui-rebuild
          fetch-depth: 0
          submodules: recursive
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev
      - name: Apply tuning and picker fix
        run: python3 scripts/apply_tuning_and_picker_fix.py
      - name: Validate tuning DSP and compact pickers
        run: |
          git diff --check
          cmake -S . -B build-tuning -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tuning --parallel 2 --target \
            cursed-drone-tests \
            cursed-drone-parameter-mapping-tests \
            cursed-drone-android-ui-interaction-tests \
            cursed-drone-android-ui-snapshots
          ctest --test-dir build-tuning --output-on-failure
          mkdir -p dist/tuning-picker
          SDL_VIDEODRIVER=dummy build-tuning/cursed-drone-android-ui-snapshots dist/tuning-picker
          test -s dist/tuning-picker/android-actor-sound.bmp
      - name: Commit validated product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/audio.cpp \
            src/scala.cpp \
            tests/test_main.cpp \
            tools/android_ui_interaction_tests.cpp \
            android/app/src/main/cpp/android_touch_main.cpp \
            android/app/src/main/cpp/approved_ui_actor_exact.inc
          git commit -m "Make tuning audible and compact Android pickers"
          git push origin HEAD:agent/android-audio-ui-rebuild
      - uses: actions/upload-artifact@v4
        with:
          name: tuning-picker-snapshots
          path: dist/tuning-picker
