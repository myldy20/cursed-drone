name: tuning-picker-fix

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  tuning-picker:
    if: github.head_ref == 'agent/android-audio-ui-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-audio-ui-rebuild
          fetch-depth: 0
          submodules: recursive
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev
      - name: Apply tuning and picker fix
        run: python3 scripts/apply_tuning_and_picker_fix.py
      - name: Validate patch
        run: git diff --check
      - name: Configure
        id: configure
        continue-on-error: true
        run: cmake -S . -B build-tuning -DCMAKE_BUILD_TYPE=Release > tuning-config.log 2>&1
      - name: Build tuning targets
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        run: |
          cmake --build build-tuning --parallel 2 --target \
            cursed-drone-tests \
            cursed-drone-parameter-mapping-tests \
            cursed-drone-android-ui-interaction-tests \
            cursed-drone-android-ui-snapshots > tuning-build.log 2>&1
      - name: Run tuning tests
        id: tests
        if: steps.configure.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: ctest --test-dir build-tuning --output-on-failure > tuning-test.log 2>&1
      - name: Render tuning snapshot
        id: snapshots
        if: steps.configure.outcome == 'success' && steps.build.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p dist/tuning-picker
          SDL_VIDEODRIVER=dummy build-tuning/cursed-drone-android-ui-snapshots dist/tuning-picker > tuning-snapshot.log 2>&1
          test -s dist/tuning-picker/android-actor-sound.bmp
      - name: Show diagnostics
        if: always()
        run: |
          for log in tuning-config.log tuning-build.log tuning-test.log tuning-snapshot.log; do
            if test -f "$log"; then
              echo "===== $log ====="
              tail -n 220 "$log"
            fi
          done
      - name: Stop after validation failure
        if: steps.configure.outcome != 'success' || steps.build.outcome != 'success' || steps.tests.outcome != 'success' || steps.snapshots.outcome != 'success'
        run: exit 1
      - name: Commit validated product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/audio.cpp \
            src/scala.cpp \
            tests/test_main.cpp \
            tools/android_ui_interaction_tests.cpp \
            android/app/src/main/cpp/android_touch_main.cpp \
            android/app/src/main/cpp/approved_ui_actor_exact.inc
          git commit -m "Make tuning audible and compact Android pickers"
          git push origin HEAD:agent/android-audio-ui-rebuild
      - uses: actions/upload-artifact@v4
        with:
          name: tuning-picker-snapshots
          path: dist/tuning-picker
