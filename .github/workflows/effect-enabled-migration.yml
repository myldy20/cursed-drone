name: effect-enabled-migration

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  migration:
    if: github.head_ref == 'agent/android-audio-ui-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-audio-ui-rebuild
          fetch-depth: 0
          submodules: recursive
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev
      - name: Apply schema 11 effect migration
        run: python3 scripts/fix_effect_enabled_migration.py
      - name: Validate migration and Android controls
        run: |
          git diff --check
          cmake -S . -B build-migration -DCMAKE_BUILD_TYPE=Release
          cmake --build build-migration --parallel 2 --target \
            cursed-drone-tests \
            cursed-drone-parameter-mapping-tests \
            cursed-drone-android-ui-interaction-tests
          ctest --test-dir build-migration --output-on-failure
      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/session.cpp tests/test_main.cpp
          git commit -m "Migrate legacy sessions to effect enable state"
          git push origin HEAD:agent/android-audio-ui-rebuild
