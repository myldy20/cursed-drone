name: repository-cleanup-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repository-cleanup-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete obsolete branches and enable automatic cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY" \
            -F delete_branch_on_merge=true >/dev/null

          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
            --jq '.[].name' | while IFS= read -r branch; do
              if [[ -z "$branch" || "$branch" == "$default_branch" ]]; then
                continue
              fi
              encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
              echo "Deleting branch: $branch"
              gh api -X DELETE \
                "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" >/dev/null
            done

      - name: Remove this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          path=".github/workflows/repository-cleanup-once.yml"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$default_branch" --jq .sha)"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='Remove one-shot repository cleanup workflow' \
            -f sha="$sha" \
            -f branch="$default_branch" >/dev/null
