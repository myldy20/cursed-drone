name: Web / GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, myldy-home]
    timeout-minutes: 30
    env:
      EMSDK_CACHE_DIR: ${{ github.workspace }}/.ci-pages-emsdk
    steps:
      - name: Runner metadata
        run: |
          echo "runner.name=${{ runner.name }}"
          echo "runner.environment=${{ runner.environment }}"
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"
      - name: Check home runner disk before Pages build
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          USED="$(df -P "$GITHUB_WORKSPACE" | awk 'NR==2 {gsub(/%/, "", $5); print $5}')"
          if (( USED >= 90 )); then
            echo "::error::Home runner filesystem is ${USED}% full; investigate disk before CI."
            exit 1
          fi
          if (( USED >= 85 )); then
            echo "::error::Home runner filesystem is ${USED}% full; refusing a heavy WASM build."
            exit 1
          fi
          if (( USED >= 80 )); then
            echo "::warning::Home runner filesystem is ${USED}% full; Pages build may proceed but cleanup is mandatory."
          fi
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify release version discipline
        env:
          BASE_SHA: ${{ github.event.before || github.sha }}
        run: python3 tools/check_version_discipline.py "$BASE_SHA"
      - name: Set up Emscripten in temporary home-runner workspace
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: ${{ env.EMSDK_CACHE_DIR }}
      - name: Build WebAssembly app
        run: |
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DCURSED_DRONE_BUILD_SDL=OFF -DCURSED_DRONE_BUILD_TESTS=OFF -DCURSED_DRONE_BUILD_TOOLS=OFF -DCURSED_DRONE_ENABLE_PLAITS=ON
          cmake --build build-web --target cursed-drone-web --parallel 2
      - name: Assemble static site
        run: |
          mkdir -p dist
          cp build-web/index.html dist/
          cp build-web/index.js dist/
          cp build-web/index.wasm dist/
          test ! -f build-web/index.data || cp build-web/index.data dist/
          touch dist/.nojekyll
          printf '%s\n' "$(cat VERSION)" > dist/version.txt
          test -s dist/index.html
          test -s dist/index.js
          test -s dist/index.wasm
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1
      - name: Cleanup Pages build workspace
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$GITHUB_WORKSPACE/build-web" \
            "$GITHUB_WORKSPACE/dist" \
            "$EMSDK_CACHE_DIR"

  deploy:
    needs: build
    runs-on: [self-hosted, myldy-vps, cursed-drone]
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Runner metadata
        run: |
          echo "runner.name=${{ runner.name }}"
          echo "runner.environment=${{ runner.environment }}"
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"
      - name: Check VPS disk before Pages activation
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          USED="$(df -P / | awk 'NR==2 {gsub(/%/, "", $5); print $5}')"
          if (( USED >= 90 )); then
            echo "::error::Selectel VPS root is ${USED}% full; investigate disk before deployment work."
            exit 1
          fi
          if (( USED >= 80 )); then
            echo "::warning::Selectel VPS root is ${USED}% full; keeping this job deployment-only."
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
