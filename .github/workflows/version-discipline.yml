name: version-discipline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  version:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, myldy-vps, cursed-drone]
    steps:
      - name: Runner metadata
        run: |
          echo "runner.name=${{ runner.name }}"
          echo "runner.environment=${{ runner.environment }}"
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a newer release version for shipped runtime changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python3 tools/check_version_discipline.py "$BASE_SHA"
